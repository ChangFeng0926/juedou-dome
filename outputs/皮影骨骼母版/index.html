<script>
const BONE_LENGTHS=Object.freeze({totalHeight:330,head:52,spine:96,pelvis:36,upperArm:62,forearm:68,thigh:78,shin:72,sword:205,gripSpacing:18});
const PARRY_WINDOW=Object.freeze({startMs:110,endMs:170});
const rad=d=>d*Math.PI/180;
const point=(origin,length,angle)=>({x:origin.x+Math.cos(rad(angle))*length,y:origin.y+Math.sin(rad(angle))*length});
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function circleIntersection(a,ra,b,rb,branch=1){
  const d=distance(a,b),ux=(b.x-a.x)/d,uy=(b.y-a.y)/d;
  const along=(ra*ra-rb*rb+d*d)/(2*d),height=Math.sqrt(Math.max(0,ra*ra-along*along));
  return{x:a.x+along*ux-branch*height*uy,y:a.y+along*uy+branch*height*ux};
}
function chooseLowerElbow(shoulder,upperLength,hand,foreLength){const a=circleIntersection(shoulder,upperLength,hand,foreLength,1),b=circleIntersection(shoulder,upperLength,hand,foreLength,-1);return a.y>=b.y?a:b}
function solveSkeleton(pose){
  const root={x:pose.rootX,y:pose.rootY};
  const shoulder=point(root,BONE_LENGTHS.spine,-90+pose.torso);
  const neck=point(shoulder,24,-90+pose.head);
  const headCenter=point(neck,26,-90+pose.head);
  // 侧视皮影只有一个肩钉：前、后臂从同一支点出发。
  const shoulderF=shoulder,shoulderR=shoulder;
  const hipF={x:root.x+18,y:root.y},hipR={x:root.x-18,y:root.y+2};
  const twoHanded=ACTIONS[currentAction].twoHanded;
  const mainGrip=twoHanded?{x:shoulder.x+pose.gripX,y:shoulder.y+pose.gripY}:point(point(shoulderF,BONE_LENGTHS.upperArm,pose.fu),BONE_LENGTHS.forearm,pose.ff);
  const offGrip=point(mainGrip,BONE_LENGTHS.gripSpacing,pose.sword+180);
  const frontElbow=twoHanded?chooseLowerElbow(shoulderF,BONE_LENGTHS.upperArm,mainGrip,BONE_LENGTHS.forearm):point(shoulderF,BONE_LENGTHS.upperArm,pose.fu);
  const rearElbow=twoHanded?circleIntersection(shoulderR,BONE_LENGTHS.upperArm,offGrip,BONE_LENGTHS.forearm,pose.rearBend||1):point(shoulderR,BONE_LENGTHS.upperArm,pose.ru);
  const rearHand=twoHanded?offGrip:point(rearElbow,BONE_LENGTHS.forearm,pose.rf);
  const frontKnee=point(hipF,BONE_LENGTHS.thigh,pose.ft),frontAnkle=point(frontKnee,BONE_LENGTHS.shin,pose.fs);
  // 侧视双腿的膝盖都朝角色前方（右侧）弯；后腿只保留较小的前移量。
  const rearKneeAngle=Math.min(pose.rt,88),rearShinAngle=Math.max(pose.rs,92);
  const rearKnee=point(hipR,BONE_LENGTHS.thigh,rearKneeAngle),rearAnkle=point(rearKnee,BONE_LENGTHS.shin,rearShinAngle);
  const swordTip=point(mainGrip,BONE_LENGTHS.sword,pose.sword);
  return{root,shoulder,shoulderF,shoulderR,neck,headCenter,hipF,hipR,frontElbow,rearElbow,mainGrip,offGrip,rearHand,twoHanded,frontKnee,frontAnkle,rearKnee,rearAnkle,swordTip};
}

  {t:1,name:'处决结束',...base}

const guardHitPhases=[
  {t:0,name:'防御待机·双手',...base},
  {t:.16,name:'举剑承击',...base,rootX:465,rootY:410,torso:-7,gripX:105,gripY:13,sword:-58,ft:69,fs:94,rt:111,rs:86},
  {t:.30,name:'格挡受击',...base,rootX:447,rootY:416,torso:-15,gripX:96,gripY:24,sword:-48,ft:72,fs:96,rt:108,rs:83},
  {t:.52,name:'卸力回稳',...base,rootX:458,rootY:412,torso:-8,gripX:105,gripY:25,sword:-45},
  {t:1,name:'回到防御·双手',...base}

const dodgePhases=[

  {t:.16,name:'压身预备',...base,rootX:462,rootY:421,torso:7,gripX:105,gripY:42,ft:74,fs:96,rt:106,rs:82,sword:-34},
  {t:.42,name:'后撤闪避',...base,rootX:398,rootY:416,torso:-8,gripX:104,gripY:38,ft:70,fs:94,rt:110,rs:86,sword:-30},
  {t:.615,name:'闪避后摇',...base,rootX:390,rootY:414,torso:-5,gripX:110,gripY:32,ft:68,fs:93,rt:112,rs:87,sword:-34},
  {t:1,name:'闪避回防·双手',...base,rootX:440,rootY:409,gripX:112,gripY:31,sword:-38}
];
const recoveryHitPhases=[
  {t:0,name:'后摇空档·双手',...base,rootX:390,rootY:414,torso:-5,gripX:110,gripY:32,ft:68,fs:93,rt:112,rs:87,sword:-34},

  {t:.48,name:'后摇震退',...base,rootX:352,rootY:428,torso:-20,head:-8,gripX:68,gripY:52,ft:79,fs:100,rt:101,rs:79,sword:-80},
  {t:.76,name:'受击收势',...base,rootX:370,rootY:419,torso:-12,head:-2,gripX:82,gripY:42,ft:73,fs:96,rt:107,rs:83,sword:-65},
  {t:1,name:'回到防御·双手',...base}
];
const ACTIONS=Object.freeze({idle:{duration:1400,loop:true,twoHanded:true,phases:idlePhases},slash:{duration:620,loop:false,twoHanded:false,phases:normalPhases},breakAttack:{duration:900,loop:false,twoHanded:false,phases:breakPhases},parry:{duration:550,loop:false,twoHanded:true,phases:parryPhases},execute:{duration:1050,loop:false,twoHanded:true,phases:executePhases},guardHit:{duration:480,loop:false,twoHanded:true,phases:guardHitPhases},dodge:{duration:520,loop:false,twoHanded:true,phases:dodgePhases},recoveryHit:{duration:600,loop:false,twoHanded:true,phases:recoveryHitPhases}});
const mix=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function poseAt(t){const phases=ACTIONS[currentAction].phases;if(t<=0)return phases[0];if(t>=1)return phases.at(-1);const i=phases.findIndex((p,n)=>n<phases.length-1&&t>=p.t&&t<=phases[n+1].t),a=phases[i],b=phases[i+1],u=ease((t-a.t)/(b.t-a.t)),o={name:b.name};for(const k of Object.keys(a))if(typeof a[k]==='number')o[k]=mix(a[k],b[k],u);return o}
const line=(id,a,b)=>{const el=document.getElementById(id);el.setAttribute('x1',a.x);el.setAttribute('y1',a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y)};
const jointDefs=[['root','腰'],['shoulder','肩'],['frontElbow','前肘'],['rearElbow','后肘'],['hipF','前髋'],['hipR','后髋'],['frontKnee','前膝'],['rearKnee','后膝'],['frontAnkle','前踝'],['rearAnkle','后踝'],['mainGrip','主握点'],['offGrip','副握点']];
const joints=document.getElementById('joints'),labels=document.getElementById('labels');
for(const [key,label] of jointDefs){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.id=`joint-${key}`;c.setAttribute('r',key.includes('Grip')?9:7);c.setAttribute('class',`joint ${key.includes('rear')||key.endsWith('R')?'rear':''} ${key.includes('Grip')?'grip':''}`);joints.append(c);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.id=`label-${key}`;t.setAttribute('class','label');t.textContent=label;labels.append(t)}
function verify(points){const pairs=[[points.root,points.shoulder,96],[points.shoulderF,points.frontElbow,62],[points.shoulderR,points.rearElbow,62],[points.frontElbow,points.mainGrip,68],[points.rearElbow,points.rearHand,68],[points.hipF,points.frontKnee,78],[points.frontKnee,points.frontAnkle,72],[points.hipR,points.rearKnee,78],[points.rearKnee,points.rearAnkle,72],[points.mainGrip,points.swordTip,205]];const legsOrdered=points.rearKnee.x<points.frontKnee.x&&points.rearAnkle.x<points.frontAnkle.x;const kneesForward=points.frontKnee.x>points.hipF.x&&points.rearKnee.x>points.hipR.x;const rearBendSmaller=(points.rearKnee.x-points.hipR.x)<(points.frontKnee.x-points.hipF.x);return legsOrdered&&kneesForward&&rearBendSmaller&&pairs.every(([a,b,l])=>Math.abs(distance(a,b)-l)<.01)}
function render(t){
  const pose=poseAt(t),p=solveSkeleton(pose),action=ACTIONS[currentAction],elapsed=t*action.duration;
  line('spineBone',p.root,p.shoulder);line('shoulderBone',p.shoulderR,p.shoulderF);line('rearUpperBone',p.shoulderR,p.rearElbow);line('rearForeBone',p.rearElbow,p.rearHand);line('frontUpperBone',p.shoulderF,p.frontElbow);line('frontForeBone',p.frontElbow,p.mainGrip);line('rearThighBone',p.hipR,p.rearKnee);line('rearShinBone',p.rearKnee,p.rearAnkle);line('frontThighBone',p.hipF,p.frontKnee);line('frontShinBone',p.frontKnee,p.frontAnkle);line('swordEdge',p.mainGrip,p.swordTip);line('swordBone',p.mainGrip,p.swordTip);
  const rearArmVisible=!p.twoHanded;document.getElementById('rearUpperBone').style.display=rearArmVisible?'':'none';document.getElementById('rearForeBone').style.display=rearArmVisible?'':'none';
  document.getElementById('pelvisBone').setAttribute('d',`M${p.hipR.x} ${p.hipR.y}L${p.root.x} ${p.root.y+12}L${p.hipF.x} ${p.hipF.y}`);
  const head=document.getElementById('headShape');head.setAttribute('cx',p.headCenter.x);head.setAttribute('cy',p.headCenter.y);
  for(const [key] of jointDefs){const c=document.getElementById(`joint-${key}`),label=document.getElementById(`label-${key}`),q=p[key],rear=key.includes('rear')||key.endsWith('R');c.setAttribute('cx',q.x);c.setAttribute('cy',q.y);label.setAttribute('x',q.x+(rear?-42:11));label.setAttribute('y',q.y+(key.includes('Knee')?18:-10));const hiddenRearArm=p.twoHanded&&(key==='shoulderR'||key==='rearElbow'||key==='offGrip');const show=!hiddenRearArm&&(key!=='offGrip'||p.twoHanded);c.style.display=show?'':'none';label.style.display=show?'':'none'}
  const valid=verify(p),gripValid=!p.twoHanded||Math.abs(distance(p.mainGrip,p.offGrip)-BONE_LENGTHS.gripSpacing)<.01;document.getElementById('lengthState').textContent=`固定骨长 ${valid?'✓':'✗'}`;document.getElementById('gripState').textContent=`${p.twoHanded?'双手握持':'单手握持'} ${gripValid?'✓':'✗'}`;
  const parry=currentAction==='parry'&&elapsed>=PARRY_WINDOW.startMs&&elapsed<=PARRY_WINDOW.endMs;document.getElementById('stage').classList.toggle('parry',parry);document.getElementById('phase').textContent=parry?'弹反有效':pose.name;document.getElementById('progress').value=Math.round(t*1000);
}
let currentAction='idle',current=0,playing=true,last=0;
function tick(now){if(!playing)return;if(!last)last=now;const action=ACTIONS[currentAction];current+=(now-last)/action.duration;last=now;if(current>=1){if(action.loop)current%=1;else{current=1;playing=false}}render(current);if(playing)requestAnimationFrame(tick)}
function selectAction(name){currentAction=name;current=0;last=0;for(const [id,key] of [['actionIdle','idle'],['actionSlash','slash'],['actionBreak','breakAttack'],['actionParry','parry'],['actionExecute','execute'],['actionGuardHit','guardHit'],['actionDodge','dodge'],['actionRecoveryHit','recoveryHit']])document.getElementById(id).classList.toggle('active',key===name);render(0);playing=true;requestAnimationFrame(tick)}
document.getElementById('actionIdle').onclick=()=>selectAction('idle');document.getElementById('actionSlash').onclick=()=>selectAction('slash');document.getElementById('actionBreak').onclick=()=>selectAction('breakAttack');document.getElementById('actionParry').onclick=()=>selectAction('parry');document.getElementById('actionExecute').onclick=()=>selectAction('execute');document.getElementById('actionGuardHit').onclick=()=>selectAction('guardHit');document.getElementById('actionDodge').onclick=()=>selectAction('dodge');document.getElementById('actionRecoveryHit').onclick=()=>selectAction('recoveryHit');document.getElementById('play').onclick=()=>{if(current>=1)current=0;playing=true;last=0;requestAnimationFrame(tick)};document.getElementById('pause').onclick=()=>playing=false;document.getElementById('step').onclick=()=>{playing=false;current=Math.min(1,current+1/(ACTIONS[currentAction].duration/1000*30));render(current)};document.getElementById('replay').onclick=()=>{current=0;render(0);playing=true;last=0;requestAnimationFrame(tick)};document.getElementById('progress').oninput=e=>{playing=false;current=Number(e.target.value)/1000;render(current)};
render(0);requestAnimationFrame(tick);
</script>
</body></html>
